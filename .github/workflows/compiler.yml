name: Camellian KernelSU Compiler
on:
  workflow_dispatch:

jobs:
  kernel_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex \
            g++-multilib gcc-multilib git gnupg gperf \
            libncurses-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python-is-python3 libtinfo-dev

      - name: Setup Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S

      - name: Download Official Xiaomi Source
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b camellian-s-oss source-code

      - name: Download KernelSU Source
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU.git kernel

      - name: Inject KernelSU Support
        run: |
          cd $GITHUB_WORKSPACE/source-code
          echo "obj-y += drivers/kernelsu/" >> drivers/Makefile
          ln -sf $GITHUB_WORKSPACE/kernel/kernel drivers/kernelsu

      - name: Start Compilation Process
        run: |
          cd $GITHUB_WORKSPACE/source-code
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          make O=out camellian_defconfig
          make O=out -j$(nproc)

      - name: Output Boot Flashable Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-KernelSU-Boot
          path: source-code/out/arch/arm64/boot/Image.gz-dtb
