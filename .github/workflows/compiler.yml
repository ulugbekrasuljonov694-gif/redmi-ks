name: Camellian KernelSU Compiler
on:
  workflow_dispatch:

jobs:
  kernel_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiler Dependencies
        run: |
          sudo apt-get update
          # Eski paket muammosini avtomat hal qilish
          wget -q http://ftp.de.debian.org/debian/pool/main/n/ncurses/libtinfo5_6.1+20181013-2+deb10u5_amd64.deb || true
          if [ -f libtinfo5_6.1+20181013-2+deb10u5_amd64.deb ]; then
            sudo dpkg -i libtinfo5_6.1+20181013-2+deb10u5_amd64.deb || sudo apt-get install -f -y
          fi
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf libreadline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Setup Clang 14 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang14
          cd $GITHUB_WORKSPACE/clang14
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xf clang+llvm-14.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz --strip-components=1

      - name: Download Official Xiaomi Source
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b camellian-r-oss source-code

      - name: Download KernelSU Source
        run: |
          cd $GITHUB_WORKSPACE
          # Agar papka yo'q bo'lsa, avtomat yuklab olish
          if [ ! -d "kernel" ]; then
            git clone --depth=1 https://github.com/tiann/KernelSU.git kernel
          fi

      - name: Inject KernelSU Support
        run: |
          cd $GITHUB_WORKSPACE/source-code
          # Qayta ulanish xatolarini oldini olish
          if ! grep -q "drivers/kernelsu/" drivers/Makefile; then
            echo "obj-y += drivers/kernelsu/" >> drivers/Makefile
          fi
          rm -rf drivers/kernelsu
          ln -sf $GITHUB_WORKSPACE/kernel/kernel drivers/kernelsu
          
      - name: Start Compilation Process
        run: |
          cd $GITHUB_WORKSPACE/source-code
          export PATH=$GITHUB_WORKSPACE/clang14/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          make O=out camellian_defconfig
          make O=out -j$(nproc)

      - name: Output Boot Flashable Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-KernelSU-Boot
          path: source-code/out/arch/arm64/boot/Image.gz-dtb
